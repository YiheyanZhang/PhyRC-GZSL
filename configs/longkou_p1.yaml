dataset:
  name: WHU-Hi-LongKou
  raw_dir: data/raw
  processed_dir: data/processed
  data_file: WHU-Hi-LongKou/WHU_Hi_LongKou.mat
  gt_file: WHU-Hi-LongKou/WHU_Hi_LongKou_gt.mat
  data_key: WHU_Hi_LongKou
  gt_key: WHU_Hi_LongKou_gt
classes:
  names:
    1: Corn
    2: Cotton
    3: Sesame
    4: Broad-leaf soybean
    5: Narrow-leaf soybean
    6: Rice
    7: Water
    8: Roads and houses
    9: Mixed weed
  seen_classes: [2, 3, 4, 5, 6, 7, 8, 9]
  unseen_classes: [1]
model:
  backbone: spectral_morphology
  feature_dim: 64
  freeze_backbone: true
spectral_mae:
  feature_dim: 64
  hidden_dim: 256
  mask_ratio: 0.3
  mae_weight: 1.0
  supcon_weight: 0.1
  temperature: 0.2
  epochs: 100
  batch_size: 512
  lr: 0.001
  weight_decay: 0.0001
  checkpoint: checkpoints/longkou_p1_backbone.pt
runtime:
  device: auto
  num_workers: 0
  seed: 42
data_split:
  normalization: seen_train
  train_ratio: 0.2
  seed: 42
